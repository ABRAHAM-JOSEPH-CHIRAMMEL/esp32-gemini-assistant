name: Backend validation
on:
  push:
    branches: [main]
    paths:
      - 'esp32-gemini-assistant-integrated/**'
      - '.github/workflows/backend-check.yml'
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esp32-gemini-assistant-integrated
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run check
      - name: Check inline browser simulator JavaScript
        run: |
          node --input-type=commonjs -e 'const fs=require("node:fs"); const vm=require("node:vm"); const html=fs.readFileSync("public/index.html","utf8"); const scripts=[...html.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)].map(m=>m[1]).filter(s=>s.trim()); if(!scripts.length) throw new Error("No inline scripts found"); scripts.forEach((source,index)=>new vm.Script(source,{filename:"public/index.html:inline-script-"+index})); console.log("Validated "+scripts.length+" inline browser script(s).");'
